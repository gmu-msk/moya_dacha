name: Деплой

# Прод — один VPS, деплой только отсюда и только с main (ADR-0004).
# В PR, который трогает деплой, вместо деплоя идёт проверка доступа:
# она только входит на машину и ничего на ней не меняет.
#
# Секреты репозитория: VPS_HOST (IP), VPS_USER (root или пользователь
# с sudo без пароля), VPS_SSH_KEY (приватный ключ). Переменная
# репозитория DOMAIN необязательна: без неё адрес — <ip-через-дефисы>.sslip.io.

on:
  push:
    branches: [main]
    # Правка только документации не меняет ни сервер, ни приложение.
    paths-ignore: ['*.md', 'docs/**', '.claude/**']
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Два деплоя одновременно на одну машину не идут.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: false

jobs:
  probe:
    name: Доступ к VPS
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ключ SSH
        run: ./deploy/ssh-setup.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Репозиторий публичный: итог и лог видят все, поэтому сведений
      # о машине здесь нет — только есть ли вход и права для деплоя.
      - name: Вход и sudo
        run: |
          ssh vps '[ "$(id -u)" = 0 ] || sudo -n true' ||
            { echo "Вход есть, но sudo без пароля нет: деплой не пройдёт" >&2; exit 1; }
          echo "Доступ к VPS есть, sudo без пароля есть" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Сервер
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.domain.outputs.domain }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Адрес сервера
        id: domain
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: echo "domain=${DOMAIN:-${VPS_HOST//./-}.sslip.io}" >> "$GITHUB_OUTPUT"

      # Статические бинарники: на VPS не нужен ни Go, ни libc нужной версии.
      - name: Релиз
        run: |
          mkdir -p release
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/moya-dacha-server ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/goose github.com/pressly/goose/v3/cmd/goose
          cd ..
          cp -r backend/migrations release/
          cp deploy/setup.sh deploy/release.sh deploy/backup.sh deploy/Caddyfile \
            deploy/moya-dacha.service deploy/moya-dacha-backup.service \
            deploy/moya-dacha-backup.timer deploy/moya-dacha-relay.service release/
          tar -czf release.tgz release

      - name: Ключ SSH
        run: ./deploy/ssh-setup.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      # Токен бота идёт на сервер через stdin, а не в командной строке:
      # там его видно в списке процессов (specs/018-telegram-bot.md).
      - name: Настройка машины и выкладка
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Ник владельца — переменная репозитория, но и секрет с тем же
          # именем подойдёт: оба пути выглядят в настройках одинаково.
          TELEGRAM_OWNER: ${{ vars.TELEGRAM_OWNER || secrets.TELEGRAM_OWNER }}
          TELEGRAM_API_URL: ${{ vars.TELEGRAM_API_URL || secrets.TELEGRAM_API_URL }}
          # Отзывы становятся задачами этого репозитория (specs/019-feedback.md):
          # fine-grained токен, только Issues: read and write.
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          # Ключ сервисного аккаунта Firebase для пушей (specs/024-push.md,
          # требование 18): JSON целиком, на сервер — в base64 одной строкой.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # С прода api.telegram.org не открывается: бот ходит в Telegram
          # через SSH-туннель до второго VPS (specs/018-telegram-bot.md, 3б).
          # RELAY_HOST может быть и «адрес:порт».
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
          RELAY_PORT: ${{ vars.RELAY_PORT || secrets.RELAY_PORT }}
          RELAY_USER: ${{ vars.RELAY_USER || secrets.RELAY_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
        run: |
          scp release.tgz vps:/tmp/moya-dacha-release.tgz
          # Ключ и адрес второго VPS — тоже через stdin; setup.sh заберёт их
          # из /tmp/moya-dacha-relay и удалит.
          ssh vps 'rm -rf /tmp/moya-dacha-relay'
          if [ -n "$RELAY_HOST" ]; then
            host="${RELAY_HOST%%:*}" port="${RELAY_PORT:-22}"
            case "$RELAY_HOST" in *:*) port="${RELAY_HOST##*:}" ;; esac
            printf 'RELAY_HOST=%s\nRELAY_PORT=%s\nRELAY_USER=%s\n' "$host" "$port" "${RELAY_USER:-root}" |
              ssh vps '(umask 077; mkdir /tmp/moya-dacha-relay; cat > /tmp/moya-dacha-relay/relay.env)'
            printf '%s\n' "$RELAY_SSH_KEY" | ssh vps '(umask 077; cat > /tmp/moya-dacha-relay/key)'
          fi
          fcm=""
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || fcm=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -w0)
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_OWNER=%s\nTELEGRAM_API_URL=%s\nFEEDBACK_GITHUB_TOKEN=%s\nFCM_CREDENTIALS=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_OWNER" "$TELEGRAM_API_URL" "$FEEDBACK_GITHUB_TOKEN" "$fcm" |
          ssh vps "set -e
            sudo=\$( [ \"\$(id -u)\" = 0 ] || echo sudo )
            rm -rf /tmp/moya-dacha-release && mkdir /tmp/moya-dacha-release
            tar -xzf /tmp/moya-dacha-release.tgz -C /tmp/moya-dacha-release --strip-components=1
            (umask 077; cat > /tmp/moya-dacha-release/telegram.env)
            \$sudo env DOMAIN='$DOMAIN' bash /tmp/moya-dacha-release/setup.sh
            \$sudo bash /tmp/moya-dacha-release/release.sh"

      - name: Сервис виден снаружи
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          # Первый сертификат Caddy получает не сразу.
          for _ in $(seq 1 30); do
            curl -fsS "https://$DOMAIN/api/health" && exit 0
            sleep 5
          done
          echo "https://$DOMAIN/api/health не ответил" >&2
          exit 1

      - name: Итог
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          # Состояние Telegram-бота (specs/018-telegram-bot.md): токен,
          # владелец, привязанные чаты. Из итога прогона его видно с телефона.
          # PUBLIC_OUTPUT: без ника владельца, пути до Telegram и ошибок.
          bot="$(ssh vps "sudo -u moya-dacha bash -c 'set -a; . /etc/moya-dacha.env; set +a; PUBLIC_OUTPUT=1 exec moya-dacha-server telegram-check'" 2>&1 || true)"
          # Пуши (specs/024-push.md, требование 16): принял ли Firebase ключ.
          push="$(ssh vps "sudo -u moya-dacha bash -c 'set -a; . /etc/moya-dacha.env; set +a; exec moya-dacha-server push-check'" 2>&1 || true)"
          {
            echo "Сервер: https://$DOMAIN/api"
            echo
            echo "Приложение для тестировщиков: https://$DOMAIN/app.apk"
            echo
            echo "Дашборд: https://$DOMAIN/dashboard (пароль пришлёт в Telegram прогон «Дашборд» с действием «пароль»)"
            echo
            printf '%s\n' "$bot" | sed 's/$/  /'
            printf '%s\n' "$push" | sed 's/$/  /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # APK для тестировщиков: адрес сервера зашит, экран «Сервер» его только
  # переопределяет (ADR-0013). Собирается после деплоя, чтобы приложение не
  # приехало раньше сервера, который ему нужен.
  apk:
    name: Приложение для тестировщиков
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ needs.deploy.outputs.domain }}
    steps:
      # «Что нового» — заголовки коммитов main со сборки, которая сейчас
      # лежит на сервере: нужна история, а не один коммит.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Ключ SSH
        run: ./deploy/ssh-setup.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      # Постоянный ключ подписи лежит на VPS (ADR-0021): с ним новая
      # сборка ставится поверх старой.
      - name: Ключ подписи
        run: ./deploy/signing-key.sh

      # Тот же кэш Gradle и тот же ключ, что в CI: без него сборка качает
      # зависимости заново, а сохранённый здесь кэш main подхватывают
      # и первые прогоны новых веток PR.
      - name: Кэш Gradle
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Настройки Firebase для пушей (specs/024-push.md, требование 17):
      # без секрета приложение собирается без пушей.
      - name: Сборка
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mobile/tool/firebase-config.sh
          since=$(curl -fsS "https://$DOMAIN/app.json" | jq -r '.commit // empty' || true)
          build=$(SINCE="$since" mobile/tool/stamp-build.sh)
          echo "Сборка $build, что нового:"
          jq -r '.whatsNew[]' mobile/assets/build_info.json
          cd mobile
          flutter pub get
          flutter build apk --release --build-number="$build" \
            --dart-define=API_BASE_URL=https://$DOMAIN/api
          rm -f android/key.properties "$RUNNER_TEMP/moya-dacha-release.jks"

      - name: Сохранить кэш Gradle
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Сначала APK, потом app.json: приложение, узнавшее о новой версии,
      # должно найти по ссылке уже её.
      - name: Выложить на сервер
        run: |
          scp mobile/build/app/outputs/flutter-apk/app-release.apk vps:/tmp/moya-dacha.apk
          scp mobile/assets/build_info.json vps:/tmp/moya-dacha.json
          ssh vps 'sudo=$( [ "$(id -u)" = 0 ] || echo sudo )
            $sudo install -m 644 /tmp/moya-dacha.apk /var/www/moya-dacha/moya-dacha.apk
            $sudo install -m 644 /tmp/moya-dacha.json /var/www/moya-dacha/moya-dacha.json'
          echo "APK: https://$DOMAIN/app.apk" >> "$GITHUB_STEP_SUMMARY"

      # Сборка main — в группу тестировщиков со «Что нового»: файлом, а
      # если APK больше лимита Telegram 50 МБ — ссылкой (specs/018-telegram-bot.md,
      # требования 16а и 19). Бот не настроен или группа не привязана —
      # команда так и скажет. Ошибка Telegram видна жёлтым шагом, деплой
      # из-за неё не краснеет.
      - name: Сборка в Telegram
        continue-on-error: true
        run: |
          set -o pipefail
          ssh vps "sudo -u moya-dacha bash -c 'set -a; . /etc/moya-dacha.env; set +a;
            exec moya-dacha-server build-notify group /var/www/moya-dacha/moya-dacha.json /var/www/moya-dacha/moya-dacha.apk https://$DOMAIN/app.apk'" |
            tee -a "$GITHUB_STEP_SUMMARY"
