name: Приглашение

# Выдать, отозвать или посмотреть приглашения на проде с телефона:
# Actions → «Приглашение» → Run workflow (specs/015-invites.md).
# Репозиторий публичный, лог и итог прогона видят все. Поэтому код
# приглашения сюда не попадает — он приходит владельцу в личку бота, а
# номера печатаются под маской (specs/015-invites.md, требование 18).

on:
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать
        type: choice
        options: [выдать, отозвать, список]
        default: выдать
      phone:
        description: Номер телефона (для «выдать» и «отозвать»)
        type: string
        required: false

jobs:
  invite:
    name: Приглашение
    runs-on: ubuntu-latest
    steps:
      # Номер берётся из события, а не из env шага: env шага печатается
      # в лог до того, как маска успела бы сработать.
      - name: Спрятать номер
        run: |
          phone="$(jq -r '.inputs.phone // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$phone" ]; then
            digits="$(printf '%s' "$phone" | tr -cd '0-9')"
            echo "::add-mask::$phone"
            [ -n "$digits" ] && echo "::add-mask::$digits"
            [ "${#digits}" -ge 10 ] && echo "::add-mask::${digits: -10}"
          fi
          {
            echo 'PHONE<<__PHONE__'
            printf '%s\n' "$phone"
            echo '__PHONE__'
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Ключ SSH
        run: ./deploy/ssh-setup.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Команда на сервере
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            выдать) cmd=invite ;;
            отозвать) cmd=uninvite ;;
            *) cmd=invites; PHONE="" ;;
          esac
          # Номер — только цифры, плюс, пробелы, скобки и дефисы: в команду
          # на сервере не должно попасть ничего другого.
          case "$PHONE" in
            *[!0-9+\ \(\)-]*) echo "Номер записан с посторонними символами." >&2; exit 1 ;;
          esac
          if [ "$cmd" != invites ] && [ -z "$PHONE" ]; then
            echo "Для «$ACTION» нужен номер телефона." >&2
            exit 1
          fi
          # sudo здесь нужен и под root: им команда уходит от имени сервиса.
          # INVITE_PUBLIC_OUTPUT: код уходит в Telegram, номера под маской.
          out="$(ssh vps "sudo -u moya-dacha bash -c 'set -a; . /etc/moya-dacha.env; set +a; INVITE_PUBLIC_OUTPUT=1 exec moya-dacha-server \"\$@\"' _ $cmd ${PHONE:+\"$PHONE\"}")"
          echo "$out"
          {
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
