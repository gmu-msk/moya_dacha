name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ветку отменяет её прошлый прогон: ждать результат, который
# уже устарел, незачем. Прогоны main не отменяются — там каждый коммит
# должен быть проверен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Контракт, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Dart-клиент генерируется openapi-generator-ом, это java-программа.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Контракт — источник истины (ADR-0001): сгенерированный код обязан
      # совпадать с тем, что получается из specs/openapi.yaml.
      - name: Сгенерированный код не разошёлся с контрактом
        run: make check-generated

      - name: go vet
        run: make vet

      # Гейт (ADR-0002): интеграционные тесты против настоящей Postgres,
      # поднятой тем же compose-файлом, что и локально.
      - name: Интеграционные тесты
        run: make test

      - name: Сборка
        run: make build

  # Стенд для демонстрации (demo/README.md) ломается незаметно, если его
  # не поднимать: проверяем, что `make demo` доводит сервис до ответа
  # на /api/health. Основной гейт из ADR-0002 — это job выше.
  demo:
    name: Демо-стенд поднимается
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Стенд поднимается одной командой
        run: make demo

      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs

      - name: Погасить стенд
        if: always()
        run: make demo-reset

  # E2E-демо: приложение в эмуляторе ходит в настоящий сервис на стенде.
  # UI-тестов у клиента нет и не планируется (ADR-0002) — это проверка
  # того, что путь эмулятор -> приложение -> API -> Postgres цел.
  app:
    name: Приложение и e2e-демо в эмуляторе
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Джоб тащит на один раннер Flutter, Gradle, образы стенда и системный
      # образ эмулятора — вместе они не влезают. Выкидываем то, что на этом
      # раннере предустановлено и нам не нужно.
      - name: Освободить место на раннере
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/node_modules /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Стенд и APK друг от друга не зависят, а по отдельности занимали
      # больше половины джоба. Поднимаем стенд рядом со сборкой, а не после
      # неё; результат забирает шаг «Дождаться демо-стенда».
      - name: Поднять демо-стенд рядом со сборкой
        run: |
          nohup bash -c 'make demo; echo $? > "$RUNNER_TEMP/demo.status"' \
            > "$RUNNER_TEMP/demo.log" 2>&1 &

      - name: Зависимости приложения
        run: make app-get

      - name: Статический анализ приложения
        run: make app-analyze

      # Без кэша Gradle качает зависимости и дистрибутив заново на каждом
      # прогоне — это была самая дорогая часть джоба. Кладём кэш вручную,
      # потому что перед эмулятором его всё равно приходится стирать ради
      # места на диске, а actions/cache сохранял бы уже стёртое.
      - name: Кэш Gradle
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Сборка debug-APK
        run: make app-apk

      - name: Сохранить кэш Gradle
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Дождаться демо-стенда
        run: |
          deadline=$((SECONDS + 900))
          until [ -f "$RUNNER_TEMP/demo.status" ]; do
            if ((SECONDS > deadline)); then
              echo "Стенд не поднялся за 15 минут." >&2
              cat "$RUNNER_TEMP/demo.log" >&2
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/demo.log"
          exit "$(cat "$RUNNER_TEMP/demo.status")"

      # Образы стенда уже собраны и запущены, APK собран — кэши сборки
      # больше не нужны, а места они занимают больше, чем сами образы.
      - name: Выбросить кэши сборки
        run: |
          docker builder prune --all --force
          rm -rf ~/.gradle
          df -h /

      # Эмулятор без аппаратной виртуализации бесполезно медленный.
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Приложение в эмуляторе против стенда
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: make demo-e2e

      - name: Снимок экрана из эмулятора
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: demo/out/e2e-screenshot.png
          if-no-files-found: warn

      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs

      - name: Погасить стенд
        if: always()
        run: make demo-reset
