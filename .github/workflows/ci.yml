name: CI

# Минуты Actions в приватном репозитории платные, поэтому правки только
# в документации CI не гоняют, а main проверяется одним быстрым гейтом:
# стенд и эмулятор на этом коде уже прошли в PR.
on:
  pull_request:
    paths-ignore: ['*.md', 'docs/**', '.claude/**']
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.claude/**']
  workflow_dispatch:

# Новый пуш в ветку отменяет её прошлый прогон: ждать результат, который
# уже устарел, незачем. Прогоны main не отменяются — там каждый коммит
# должен быть проверен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Контракт, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Dart-клиент генерируется openapi-generator-ом, это java-программа.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Контракт — источник истины (ADR-0001): сгенерированный код обязан
      # совпадать с тем, что получается из specs/openapi.yaml.
      - name: Сгенерированный код не разошёлся с контрактом
        run: make check-generated

      - name: go vet
        run: make vet

      # У каждой user-story есть сценарий показа (ADR-0009). Проверяем форму
      # сценариев; заодно шаг перечислит спеки фич, у которых сценария нет.
      - name: Сценарии показа
        run: make check-stories

      # Гейт (ADR-0002): интеграционные тесты против настоящей Postgres,
      # поднятой тем же compose-файлом, что и локально.
      - name: Интеграционные тесты
        run: make test-ci

      - name: Сборка
        run: make build

  # Стенд для демонстрации (demo/README.md) ломается незаметно, если его
  # не поднимать: проверяем, что `make demo` доводит сервис до ответа
  # на /api/health. Основной гейт из ADR-0002 — это job выше.
  demo:
    name: Демо-стенд поднимается
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Стенд поднимается одной командой
        run: make demo

      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs

      - name: Погасить стенд
        if: always()
        run: make demo-reset

  # E2E-демо: приложение в эмуляторе ходит в настоящий сервис на стенде.
  # UI-тестов у клиента нет и не планируется (ADR-0002) — это проверка
  # того, что путь эмулятор -> приложение -> API -> Postgres цел.
  app:
    name: Приложение и e2e-демо в эмуляторе
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4

      # Джоб тащит на один раннер Flutter, Gradle, образы стенда и системный
      # образ эмулятора — вместе они не влезают. Выкидываем то, что на этом
      # раннере предустановлено и нам не нужно.
      - name: Освободить место на раннере
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/node_modules /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Стенд и APK друг от друга не зависят, а по отдельности занимали
      # больше половины джоба. Поднимаем стенд рядом со сборкой, а не после
      # неё; результат забирает шаг «Дождаться демо-стенда».
      #
      # Стенд поднимается сразу с данными сценария показа, который прогоняем
      # ниже: так проверяется и сам механизм сценариев, а не только e2e-путь.
      - name: Поднять демо-стенд рядом со сборкой
        env:
          DEMO_STORY: 000-status
        run: |
          nohup bash -c 'make demo; echo $? > "$RUNNER_TEMP/demo.status"' \
            > "$RUNNER_TEMP/demo.log" 2>&1 &

      - name: Зависимости приложения
        run: make app-get

      - name: Статический анализ приложения
        run: make app-analyze

      # Экран, который падает при сборке, иначе виден только прогоном
      # в эмуляторе — а он идёт минуты (ADR-0012).
      - name: Экраны собираются
        run: make app-test

      # Без кэша Gradle качает зависимости и дистрибутив заново на каждом
      # прогоне — это была самая дорогая часть джоба. Кладём кэш вручную,
      # потому что перед эмулятором его всё равно приходится стирать ради
      # места на диске, а actions/cache сохранял бы уже стёртое.
      - name: Кэш Gradle
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Сборка debug-APK
        run: make app-apk

      - name: Сохранить кэш Gradle
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Сборка для телефона отличается от эмуляторной только адресом по
      # умолчанию: эмулятор ходит на стенд по 10.0.2.2, а телефон — на
      # тестовый сервер на VPS, тот же, что у release-APK (deploy.yml).
      # Эмуляторная сборка откладывается и возвращается на место: прогон
      # в эмуляторе ниже берёт APK из обычного пути сборки. Другой адрес
      # (стенд по `/стенд`) по-прежнему задаётся в самом приложении.
      #
      # Ещё она подписана постоянным ключом с VPS и несёт номер сборки и
      # «Что нового» — заголовок PR: так она встаёт поверх сборки из main
      # и наоборот (specs/017-app-updates.md, ADR-0021).
      - name: Сборка APK для телефона
        if: github.event_name == 'pull_request'
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          apk=mobile/build/app/outputs/flutter-apk/app-debug.apk
          cp "$apk" "$RUNNER_TEMP/emulator.apk"
          domain="${DOMAIN:-${VPS_HOST//./-}.sslip.io}"
          # Без доступа к VPS (PR от бота) — debug-ключ: сборка встанет
          # только начисто, но соберётся.
          if [ -n "$VPS_SSH_KEY" ]; then
            ./deploy/ssh-setup.sh
            ./deploy/signing-key.sh
          else
            echo "::warning::Нет доступа к VPS: APK подписан debug-ключом и поверх не встанет"
          fi
          build=$(WHATS_NEW="$PR_TITLE" COMMIT="$SHA" mobile/tool/stamp-build.sh)
          make app-apk \
            APP_DART_DEFINE="--dart-define=API_BASE_URL=https://$domain/api" \
            APP_BUILD_ARGS="--build-number=$build"
          rm -f mobile/android/key.properties "$RUNNER_TEMP/moya-dacha-release.jks"
          cp "$apk" "$RUNNER_TEMP/phone.apk"
          cp "$RUNNER_TEMP/emulator.apk" "$apk"

      # Тестовая сборка, которую ставят с телефона: APK выкладывается
      # черновым релизом `pr-<номер>`, а прямая ссылка на него приходит
      # комментарием в PR (ADR-0013). По умолчанию она ходит на тестовый
      # сервер (шаг выше), другой адрес человек задаёт в самом
      # приложении. Выкладывается сразу после сборки, до
      # эмулятора: посмотреть глазами обычно надо как раз то, что в
      # эмуляторе упало. Артефактом прогона APK не передаётся: квота
      # хранилища артефактов кончается, и тогда падала вся сборка.
      - name: Выложить релизом PR
        id: release
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          short="${SHA:0:7}"
          file="moya-dacha-pr$PR-$short.apk"
          cp "$RUNNER_TEMP/phone.apk" "$file"

          # Тег переиздаётся целиком: иначе он остался бы на первом коммите
          # PR, а ссылка вела бы на старую сборку.
          gh release delete "pr-$PR" --cleanup-tag --yes 2>/dev/null || true
          gh release create "pr-$PR" "$file" \
            --target "$SHA" \
            --prerelease \
            --title "Тестовая сборка PR #$PR" \
            --notes "Сборка коммита $short для проверки с телефона. Ставится по ссылке ниже; по умолчанию ходит на тестовый сервер, другой адрес задаётся в самом приложении."

          echo "url=https://github.com/$REPO/releases/download/pr-$PR/$file" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      # Владельцу в личку — ссылка на эту сборку (specs/018-telegram-bot.md,
      # требование 19). Команда живёт в сервисе на VPS, то есть в main:
      # в PR, который её только добавляет, шаг упадёт — поэтому он и не
      # роняет прогон.
      - name: Сборка владельцу в Telegram
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          URL: ${{ steps.release.outputs.url }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$VPS_SSH_KEY" ] || exit 0
          ssh vps "sudo -u moya-dacha bash -c 'set -a; . /etc/moya-dacha.env; set +a;
            exec moya-dacha-server build-notify owner - $URL'" < mobile/assets/build_info.json

      # Комментарий один на весь PR: каждая следующая сборка переписывает
      # его, а не добавляет новый — иначе обсуждение тонет в ссылках.
      - name: Ссылка комментарием в PR
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ steps.release.outputs.url }}
          SHORT: ${{ steps.release.outputs.short }}
        run: |
          set -euo pipefail

          {
            echo '<!-- тестовая сборка -->'
            echo "📱 **Тестовая сборка** — коммит \`$SHORT\`"
            echo
            echo "[Скачать APK]($URL) — открыть ссылку с телефона и поставить."
            echo
            echo "Сборка сразу ходит на тестовый сервер. Сервер обновляется только"
            echo "из main, поэтому серверная часть этого PR на нём появится после мерджа."
            echo "Чтобы проверить её раньше, напишите в PR \`/стенд\`: адрес придёт"
            echo "ответным комментарием, в приложении он задаётся нажатием на точку"
            echo "состояния сервиса в заголовке экрана."
            echo
            echo "Замечания — комментарием сюда."
          } > comment.md

          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- тестовая сборка -->"))) | .[0].id // empty')"

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Дождаться демо-стенда
        run: |
          deadline=$((SECONDS + 900))
          until [ -f "$RUNNER_TEMP/demo.status" ]; do
            if ((SECONDS > deadline)); then
              echo "Стенд не поднялся за 15 минут." >&2
              cat "$RUNNER_TEMP/demo.log" >&2
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/demo.log"
          exit "$(cat "$RUNNER_TEMP/demo.status")"

      # Образы стенда уже собраны и запущены, APK собран — кэши сборки
      # больше не нужны, а места они занимают больше, чем сами образы.
      - name: Выбросить кэши сборки
        run: |
          docker builder prune --all --force
          # После сборки APK демон Gradle ещё жив и дописывает в свой кэш,
          # пока его стирают: rm падает на «Directory not empty». Сначала
          # гасим демон и ждём, пока он выйдет.
          pkill -f GradleDaemon || true
          for _ in $(seq 1 30); do
            pgrep -f GradleDaemon >/dev/null || break
            sleep 1
          done
          rm -rf ~/.gradle || { sleep 2; rm -rf ~/.gradle; }
          df -h /

      # Эмулятор без аппаратной виртуализации бесполезно медленный.
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Стенд уже поднят (с данными сценария), APK уже собран — поэтому
      # --keep-stand и --no-apk. Локально это одна команда: make story.
      - name: Сценарий показа в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./demo/story.sh 000-status --keep-stand --no-apk

      - name: Снимки экрана из эмулятора
        if: always()
        # Квота хранилища артефактов не повод краснеть всей сборке.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: story-screenshots
          path: demo/out/*.png
          if-no-files-found: warn

      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs

      - name: Погасить стенд
        if: always()
        run: make demo-reset
