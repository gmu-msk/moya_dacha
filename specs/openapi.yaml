openapi: 3.0.3

info:
  title: МояДача API
  version: 0.1.0
  description: |
    Источник истины для контракта между сервером и клиентами.
    Из этого файла генерируются серверные типы и роутинг (Go) и клиент (Dart).
    Руками сгенерированные файлы не правятся — см. docs/adr/0001-spec-first-openapi.md.

    Пока описан только операционный эндпоинт проверки живости: продуктовые
    эндпоинты добавляются вместе со спецификациями фич в specs/00X-*.md.

servers:
  - url: /api
    description: Базовый путь

paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и доступности базы
      description: |
        Операционный эндпоинт, не часть продуктового API. Используется
        деплоем и мониторингом.
      tags: [operations]
      responses:
        "200":
          description: Сервис жив, база отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервис жив, но база недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
        message:
          type: string
          description: Человекочитаемое описание, пригодное для показа пользователю
