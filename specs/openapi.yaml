openapi: 3.0.3

info:
  title: МояДача API
  version: 0.1.0
  description: |
    Источник истины для контракта между сервером и клиентами.
    Из этого файла генерируются серверные типы и роутинг (Go) и клиент (Dart).
    Руками сгенерированные файлы не правятся — см. docs/adr/0001-spec-first-openapi.md.

    Продуктовые эндпоинты добавляются вместе со спецификациями фич
    в specs/00X-*.md. Сейчас описаны: вход по номеру телефона
    (specs/001-auth.md), профиль пользователя (specs/002-profile.md),
    загрузка фотографий и создание поста (specs/003-posts.md),
    профиль пользователя для соседей (specs/009-user-profile.md),
    подписки и закрытые профили (specs/012-follows.md), видимость
    постов (specs/013-post-visibility.md), уведомления
    (specs/014-notifications.md), правка, блокировка и удаление
    аккаунта (specs/022-edit-block-delete.md) и операционная проверка живости.

servers:
  - url: /api
    description: Базовый путь

paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и доступности базы
      description: |
        Операционный эндпоинт, не часть продуктового API. Используется
        деплоем и мониторингом.
      tags: [operations]
      responses:
        "200":
          description: Сервис жив, база отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервис жив, но база недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/code:
    post:
      operationId: requestAuthCode
      summary: Запросить код подтверждения на номер телефона
      description: |
        Ответ одинаков для нового и для уже зарегистрированного номера:
        по нему нельзя узнать, есть ли такой пользователь.

        Доставка кода спрятана за интерфейсом: пока SMS-провайдер не выбран,
        код пишется в лог сервиса (specs/001-auth.md).

        В режиме приглашений код не отправляется: сервис только проверяет,
        что на номер есть приглашение (specs/015-invites.md).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeRequest"
      responses:
        "202":
          description: Код выдан и отправлен на номер
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeAccepted"
        "400":
          description: Номер не разбирается или не российский мобильный
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Режим приглашений, а на номер нет действующего приглашения (`not_invited`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Код на этот номер запрашивали меньше минуты назад
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeTooSoon"

  /auth/session:
    post:
      operationId: createSession
      summary: Войти по коду подтверждения
      description: |
        Регистрация и вход — одно действие: если номера ещё нет,
        пользователь создаётся, и вход помечается как первый.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Код подошёл, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: Номер или код не разбираются
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Код не тот (`invalid_code`), истёк (`code_expired`)
            или исчерпаны попытки (`too_many_attempts`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: getSession
      summary: Чья это сессия
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteSession
      summary: Выйти
      description: |
        Прекращает действие только этого токена. Сессии на других
        устройствах продолжают работать.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Сессия прекращена
        "401":
          description: Токена нет или он уже недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      operationId: getMe
      summary: Мой профиль
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль владельца токена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      operationId: updateMe
      summary: Изменить полное имя и «о себе»
      description: |
        Замена обоих полей сразу, а не частичное изменение: пустое
        `about` или `name` очищает поле. Никнейм меняется отдельно —
        `PUT /me/nickname`.
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Профиль изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: |
            Имя слишком длинное или не в одну строку (`invalid_name`),
            «о себе» слишком длинное (`invalid_about`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteMe
      summary: Удалить свой аккаунт
      description: |
        Удаление жёсткое и сразу: уходят посты с фотографиями, комментарии,
        лайки, подписки, блокировки, уведомления и все сессии. Отзывы,
        жалобы и отчёты об ошибках остаются без имени
        (specs/022-edit-block-delete.md, docs/adr/0025-account-deleted-at-once.md).
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Аккаунт удалён; тела нет, токен больше не действует
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/blocked:
    get:
      operationId: getBlocked
      summary: Мои блокировки
      description: |
        Кого смотрящий заблокировал, последние сверху, целиком: страниц
        нет, `next_cursor` не бывает (specs/022-edit-block-delete.md).
      tags: [follows]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Заблокированные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorList"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/nickname:
    put:
      operationId: setNickname
      summary: Выбрать или сменить никнейм
      description: |
        Никнейм уникален без учёта регистра и хранится так, как его ввели.
        После успешной смены `nickname_chosen` становится `true`.
        Свой же никнейм в другом регистре — не ошибка. См. specs/010-nicknames.md.
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NicknameUpdate"
      responses:
        "200":
          description: Никнейм сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: |
            Никнейм не подходит под правила (`invalid_nickname`) или тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Никнейм занят другим пользователем (`nickname_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/avatar:
    put:
      operationId: setAvatar
      summary: Поставить аватар
      description: |
        Картинка JPEG или PNG не больше 5 МБ. Сервис уменьшает её до
        512×512 и пересохраняет в JPEG; новый аватар заменяет прежний.
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Картинка JPEG или PNG
      responses:
        "200":
          description: Аватар поставлен, профиль с новой ссылкой
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Файл не картинка или в запросе нет поля `file`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Картинка больше 5 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteAvatar
      summary: Убрать аватар
      description: Убрать аватар, которого нет, — не ошибка.
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Аватара нет, профиль без ссылки на него
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/place:
    put:
      operationId: setPlace
      summary: Выбрать или убрать населённый пункт
      description: |
        Ставит пункт из тех, что сервер уже отдавал в подсказках
        `GET /places`; `null` или пустая строка убирает пункт. Пункт у
        человека один (specs/025-places.md).
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceUpdate"
      responses:
        "200":
          description: Пункт поставлен или убран
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: |
            Такого пункта сервер не отдавал в подсказках (`unknown_place`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /places:
    get:
      operationId: getPlaces
      summary: Подсказки населённых пунктов
      description: |
        До 10 пунктов из справочника ФИАС (через DaData) по набранному
        тексту: города, сёла и деревни, СНТ (specs/025-places.md).
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Набранный текст, от 2 до 100 символов после обрезки пробелов
          schema:
            type: string
      responses:
        "200":
          description: Подсказки, может быть пусто
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          description: Текст короче 2 или длиннее 100 символов (`invalid_query`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Справочник не настроен или не ответил (`places_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /places/nearby:
    get:
      operationId: getPlacesNearby
      summary: Населённые пункты рядом с точкой
      description: |
        До 10 пунктов из справочника ФИАС (через DaData) в радиусе
        километра от точки (specs/026-places-nearby.md). Координаты
        сервис не сохраняет.
      tags: [profile]
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта, от −90 до 90
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          description: Долгота, от −180 до 180
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Пункты рядом, может быть пусто
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          description: |
            Координаты вне пределов, `NaN` или бесконечность
            (`invalid_location`); нет параметра или он не число —
            `invalid_request`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Справочник не настроен или не ответил (`places_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /media:
    post:
      operationId: uploadMedia
      summary: Загрузить фотографию
      description: |
        Фотография JPEG или PNG не больше 10 МБ. Сервис уменьшает её до
        1600 по большей стороне и пересохраняет в JPEG.

        Загруженная фотография ещё не опубликована: она ждёт, пока автор
        соберёт из неё пост (specs/003-posts.md). Каждая фотография идёт
        своим запросом — на плохой связи переотправить нужно только ту,
        что не долетела.
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Фотография JPEG или PNG
      responses:
        "201":
          description: Фотография загружена и ждёт публикации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: Файл не картинка или в запросе нет поля `file`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Фотография больше 10 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts:
    post:
      operationId: createPost
      summary: Опубликовать пост
      description: |
        От одной до десяти уже загруженных фотографий и необязательная
        подпись. Поста без медиа не существует
        (docs/adr/0006-post-is-media.md).

        Порядок фотографий в посте — порядок идентификаторов в `media_ids`.
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDraft"
      responses:
        "201":
          description: Пост опубликован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: |
            Нет ни одной фотографии (`no_media`), фотографий больше десяти
            (`too_many_media`), фотография чужая, уже опубликована или не
            существует (`invalid_media`), подпись слишком длинная
            (`invalid_caption`), тэг не одно слово до 30 знаков
            (`invalid_tag`), тэгов больше десяти (`too_many_tags`), место
            не из подсказок (`unknown_place`), тело запроса не разбирается
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}:
    get:
      operationId: getPost
      summary: Показать пост
      description: |
        Лента одна на всех, поэтому пост открывается любому вошедшему
        пользователю, а не только автору (CONTEXT.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deletePost
      summary: Удалить свой пост
      description: |
        Удаление жёсткое: вместе с постом уходят его фотографии, лайки и
        комментарии, в том числе чужие
        (docs/adr/0007-hard-delete.md). Удалить можно только своё; чужое
        убирает владелец сервиса по жалобе (specs/007-deletion.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "204":
          description: Пост удалён; тела нет
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост есть, но он чужой (`not_your_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/caption:
    put:
      operationId: editCaption
      summary: Изменить подпись своего поста
      description: |
        Меняется только подпись: фотографии, видимость, лайки и
        комментарии остаются. Проверки как у удаления, потом подпись —
        как при создании поста (specs/022-edit-block-delete.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptionUpdate"
      responses:
        "200":
          description: Пост после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: |
            Подпись длиннее 1000 символов (`invalid_caption`), тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост есть, но он чужой (`not_your_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/tags:
    put:
      operationId: setPostTags
      summary: Заменить тэги своего поста
      description: |
        Тэги заменяются целиком; пустой массив снимает все. Подпись,
        фотографии и `edited_at` не меняются. Проверки как у правки
        подписи, потом тэги — как при создании поста
        (specs/028-post-tags.md, требования 9–10).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagsUpdate"
      responses:
        "200":
          description: Пост после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: |
            Тэг не одно слово до 30 знаков (`invalid_tag`), тэгов больше
            десяти (`too_many_tags`), тело без `tags` или не разбирается
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост есть, но он чужой (`not_your_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags/suggestions:
    get:
      operationId: getTagSuggestions
      summary: Подсказки тэгов для черновика поста
      description: |
        До пяти тэгов: сначала найденные в подписи, потом популярные у
        сообщества, потом из стартового словаря
        (specs/028-post-tags.md, требования 15–19).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: text
          in: query
          required: false
          description: Подпись черновика; учитываются первые 1000 знаков
          schema:
            type: string
        - name: exclude
          in: query
          required: false
          description: Тэги, уже выбранные в черновике; их в ответе нет
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestions"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /feed:
    get:
      operationId: getFeed
      summary: Страница ленты
      description: |
        Посты новые сверху. Во вкладке «Все» — посты всех пользователей,
        кроме закрытых профилей, на которые смотрящий не подписан; во
        вкладке «Подписки» — только тех, на кого он подписан, и его
        собственные (specs/012-follows.md). Отдаётся страницами — посты
        и курсор на продолжение.

        Курсор непрозрачен: клиент возвращает его как получил и сам
        не строит. Он указывает на место в порядке ленты, поэтому посты,
        выложенные между запросами страниц, не сдвигают и не задваивают
        уже пролистанное (specs/004-feed.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            Вкладка ленты: `all` — «Все» (по умолчанию), `following` —
            «Подписки»: посты тех, на кого смотрящий подписан, и его
            собственные (specs/012-follows.md, требования 15–18).
          schema:
            type: string
            enum: [all, following]
            default: all
        - name: limit
          in: query
          required: false
          description: Сколько постов вернуть, от 1 до 50
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Курсор из предыдущего ответа; без него — первая страница
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: |
            Только посты с этим тэгом; нормализуется, как тэги поста.
            Пустой — как без параметра (specs/028-post-tags.md,
            требования 12–14).
          schema:
            type: string
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: |
            `limit` вне диапазона или не число, неизвестный `scope`
            (`invalid_request`), курсор не разбирается (`invalid_cursor`),
            `tag` не одно слово до 30 знаков (`invalid_tag`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Профиль пользователя
      description: |
        Кто этот человек: имя, «о себе», аватар, когда он появился
        и сколько у него постов. Открывается любому вошедшему, свой
        профиль — той же ручкой. Номера телефона здесь нет и быть
        не может (CONTEXT.md, specs/009-user-profile.md).
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Идентификатор пользователя (UUID) — `author.id` поста или комментария
          schema:
            type: string
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/posts:
    get:
      operationId: getUserPosts
      summary: Посты пользователя страницами
      description: |
        Только посты этого человека, новые сверху, в том же виде и с тем
        же курсором, что и лента (specs/004-feed.md, specs/009-user-profile.md).
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Идентификатор пользователя (UUID)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Сколько постов вернуть, от 1 до 50
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Курсор из предыдущего ответа; без него — первая страница
          schema:
            type: string
      responses:
        "200":
          description: Страница постов пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Профиль закрыт, а смотрящий не подписан (`profile_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/follow:
    put:
      operationId: followUser
      summary: Подписаться или подать заявку
      description: |
        На открытый профиль подписка оформляется сразу, на закрытый —
        подаётся заявка (specs/012-follows.md, требование 2). Идемпотентно:
        повторная подписка или заявка ничего не меняет и не ошибка.
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Отношение смотрящего к пользователю после запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relation"
        "400":
          description: Подписка на самого себя (`cannot_follow_self`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет, он заблокировал смотрящего или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Смотрящий сам заблокировал этого пользователя (`user_blocked`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unfollowUser
      summary: Отписаться или отменить заявку
      description: |
        Идемпотентно: отписка без подписки — не ошибка
        (specs/012-follows.md, требование 3).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Отношение смотрящего к пользователю после запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relation"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/block:
    put:
      operationId: blockUser
      summary: Заблокировать
      description: |
        Разрывает подписки и заявки в обе стороны; пока блокировка есть,
        двое не видят постов и комментариев друг друга, а для
        заблокированного блокирующего нет вовсе. Идемпотентно
        (specs/022-edit-block-delete.md).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Пользователь заблокирован; тела нет
        "400":
          description: Блокировка самого себя (`cannot_block_self`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет, он заблокировал смотрящего или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unblockUser
      summary: Разблокировать
      description: |
        Снимает только блокировку: подписки сами не возвращаются.
        Разблокировать незаблокированного — не ошибка.
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Блокировки нет; тела нет
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет, он заблокировал смотрящего или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/followers:
    get:
      operationId: getFollowers
      summary: Подписчики пользователя страницами
      description: |
        Кто подписан на пользователя, новые связи сверху. Заявки сюда
        не входят. У закрытого профиля список видят только хозяин
        и подписчики (specs/012-follows.md, требования 7 и 14).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница подписчиков
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowList"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Профиль закрыт, а смотрящий не подписан (`profile_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/following:
    get:
      operationId: getFollowing
      summary: Подписки пользователя страницами
      description: |
        На кого подписан пользователь, новые связи сверху. Заявки сюда
        не входят. У закрытого профиля список видят только хозяин
        и подписчики (specs/012-follows.md, требования 7 и 14).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница подписок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowList"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Профиль закрыт, а смотрящий не подписан (`profile_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Пользователя нет или идентификатор не UUID (`user_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/privacy:
    put:
      operationId: setPrivacy
      summary: Закрыть или открыть свой профиль
      description: |
        Закрытие не трогает тех, кто уже подписан. Открытие принимает
        все ждущие заявки (specs/012-follows.md, требования 8 и 9).
      tags: [follows]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyUpdate"
      responses:
        "200":
          description: Профиль с новым признаком `closed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Нет поля `closed` или оно не булево (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/follow-requests:
    get:
      operationId: getFollowRequests
      summary: Заявки на подписку ко мне
      description: Ждущие заявки, новые сверху (specs/012-follows.md).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorList"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/follow-requests/{userId}:
    put:
      operationId: acceptFollowRequest
      summary: Принять заявку
      description: Заявитель становится подписчиком (specs/012-follows.md, требование 10).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Заявка принята
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Заявки от этого человека нет (`request_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: declineFollowRequest
      summary: Отклонить заявку
      description: |
        Заявка исчезает молча: заявитель снова видит «Подписаться»
        (specs/012-follows.md, требование 10).
      tags: [follows]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Заявка отклонена
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Заявки от этого человека нет (`request_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notifications:
    get:
      operationId: getNotifications
      summary: Мои уведомления
      description: |
        События страницами, новые сверху; лайки одного поста слиты в одну
        строку (specs/014-notifications.md). Заявки на подписку сюда
        не входят — они в `GET /me/follow-requests`. Чтение списка ничего
        не отмечает прочитанным: для этого `PUT /me/notifications/seen`.
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notifications/unread:
    get:
      operationId: getUnreadNotifications
      summary: Есть ли новое
      description: |
        Сколько строк раздела новее последнего открытия и сколько ждущих
        заявок: по ним горит точка на колокольчике
        (specs/014-notifications.md, требование 5).
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Счётчики непрочитанного
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotifications"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/notifications/seen:
    put:
      operationId: markNotificationsSeen
      summary: Отметить всё прочитанным
      description: |
        Всё, что пришло до этой минуты, становится прочитанным
        (specs/014-notifications.md, требование 7). Заявки остаются
        непрочитанными, пока ждут ответа.
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Отмечено
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/push-token:
    put:
      operationId: setPushToken
      summary: Токен FCM этого телефона
      description: |
        Телефон отдаёт токен Firebase Cloud Messaging, на него сервис шлёт
        пуши о новых уведомлениях и заявках (specs/024-push.md). Токен
        привязан к сессии: у сессии один токен, новый заменяет старый, тот
        же токен с другой сессии переезжает к ней. Выход из аккаунта
        забывает токен.
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushToken"
      responses:
        "204":
          description: Токен запомнен
        "400":
          description: |
            Токена нет, он пустой или длиннее 4096 символов
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена сессии нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/feedback:
    get:
      operationId: getMyFeedback
      summary: Мои отзывы
      description: |
        Свои отзывы разработчику, новые сверху, не больше 50, и что с ними
        стало (specs/019-feedback.md, требования 17 и 19).
      tags: [feedback]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Отзывы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendFeedback
      summary: Написать разработчику
      description: |
        Отзыв с необязательным скриншотом. Сервис записывает его и в фоне
        заводит задачу GitHub «входящее» (specs/019-feedback.md,
        требование 18).
      tags: [feedback]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Текст отзыва, 1–4000 символов после обрезки пробелов
                screenshot:
                  type: string
                  format: binary
                  description: Скриншот JPEG или PNG до 10 МБ
                app_version:
                  type: string
                  description: Версия приложения, например «1.0.0 (386900)»
                device:
                  type: string
                  description: Телефон, например «Google Pixel 7, Android 14»
      responses:
        "201":
          description: Отзыв записан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          description: |
            Текст пустой или длиннее 4000 символов (`invalid_text`),
            скриншот не картинка (`invalid_image`), запрос не разобрался
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Скриншот больше 10 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /app-sessions:
    post:
      operationId: startAppSession
      summary: Начало сессии в приложении
      description: |
        Приложение вышло на экран у вошедшего человека. Сервис заводит
        сессию со временем начала по своим часам (specs/020-app-sessions.md,
        требования 1–4).
      tags: [usage]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Сессия начата
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSessionStarted"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /app-sessions/{sessionId}/end:
    post:
      operationId: endAppSession
      summary: Конец сессии в приложении
      description: |
        Приложение ушло с экрана. Сервис ставит время конца «сейчас»
        и заменяет экраны сессии присланными. Повторная отметка сдвигает
        конец (specs/020-app-sessions.md, требования 5–9).
      tags: [usage]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSessionEnd"
      responses:
        "204":
          description: Конец отмечен
        "400":
          description: |
            Имя экрана не из `a-z` и `_` или длиннее 32, число не от 1 до
            10000, экранов больше 50 (`invalid_screens`); запрос не
            разобрался (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Сессии нет или она чужая (`not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /app-errors:
    post:
      operationId: reportAppError
      summary: Отчёт о необработанной ошибке приложения
      description: |
        Приложение поймало ошибку, которую никто не обработал, и молча
        сообщает о ней. Сервис склеивает повторы одной ошибки в группу
        (specs/021-app-errors.md, требования 1–7). Токен не обязателен:
        без него или с недействительным отчёт записывается как отчёт
        без входа, `401` ручка не отвечает.
      tags: [usage]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppErrorReport"
      responses:
        "204":
          description: Отчёт записан
        "400":
          description: |
            Поле не по правилам (`invalid_report`); запрос не разобрался
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Больше 100 отчётов за час от человека или от всех без входа
            вместе (`too_many_reports`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/visibility:
    put:
      operationId: setPostVisibility
      summary: Сменить видимость своего поста
      description: |
        Лайки и комментарии остаются; кто перестал видеть пост, их тоже
        не видит (specs/013-post-visibility.md, требование 6). Чужой
        видимый пост — `403 not_your_post`, невидимый — `404`.
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostVisibilityUpdate"
      responses:
        "200":
          description: Пост с новой видимостью
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Неизвестная видимость или её нет (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост чужой (`not_your_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста нет или он смотрящему не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/like:
    put:
      operationId: likePost
      summary: Поставить лайк
      description: |
        Один пользователь — не больше одного лайка на пост (CONTEXT.md).
        Запрос идемпотентен: повторный лайк ничего не меняет и не ошибка.

        В ответе — пост целиком, с новым числом лайков: клиенту не нужно
        досчитывать его самому (specs/005-likes.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост с поставленным лайком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unlikePost
      summary: Снять лайк
      description: |
        Идемпотентно: снять лайк, которого не было, — не ошибка
        (specs/005-likes.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост со снятым лайком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/comments:
    get:
      operationId: getComments
      summary: Комментарии поста
      description: |
        Комментарии поста от старого к новому: это разговор, и читается
        он сверху вниз. Приходят целиком, без страниц — под постом их
        столько, что курсор не нужен (specs/006-comments.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Комментарии поста
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comments"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addComment
      summary: Оставить комментарий
      description: |
        Комментарии плоские: ответов на комментарий не существует
        (CONTEXT.md). В ответе — созданный комментарий, а не пост:
        весь разговор на каждую реплику не отдаётся
        (specs/006-comments.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentDraft"
      responses:
        "201":
          description: Комментарий оставлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: |
            Текста нет или он из одних пробелов (`empty_comment`), текст
            длиннее 1000 символов (`invalid_comment`), тело запроса не
            разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{postId}/comments/{commentId}:
    put:
      operationId: editComment
      summary: Изменить свой комментарий
      description: |
        Проверки как у удаления: пост, комментарий под ним, «своё ли», и
        только потом текст. Текст проверяется как у нового комментария.
        Место в разговоре не меняется (specs/022-edit-block-delete.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentDraft"
      responses:
        "200":
          description: Комментарий после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: |
            Текста нет или он из одних пробелов (`empty_comment`), текст
            длиннее 1000 символов (`invalid_comment`), тело запроса не
            разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Комментарий есть, но он чужой (`not_your_comment`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Поста нет или он не виден (`post_not_found`), комментария нет
            либо он под другим постом (`comment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteComment
      summary: Удалить свой комментарий
      description: |
        Комментарий удаляется по адресу своего поста: сначала должен
        найтись пост, потом комментарий под ним, и только потом
        проверяется, чей он. Чужой комментарий не удаляется даже автором
        поста (specs/007-deletion.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (UUID)
          schema:
            type: string
      responses:
        "204":
          description: Комментарий удалён; тела нет
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Комментарий есть, но он чужой (`not_your_comment`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Поста нет (`post_not_found`) или комментария нет либо он под
            другим постом (`comment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/report:
    post:
      operationId: reportPost
      summary: Пожаловаться на чужой пост
      description: |
        Жалоба — сигнал владельцу сервиса, который разбирает её вручную.
        Она ничего не скрывает и ничего не меняет: пост остаётся на
        месте, автор о жалобе не узнаёт (CONTEXT.md, ADR-0017).

        На свой пост не жалуются — свой удаляют (specs/007-deletion.md).
        Повторная жалоба того же человека принимается так же, как
        первая, и ничего не меняет (specs/008-reports.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDraft"
      responses:
        "202":
          description: |
            Жалоба принята; тела нет. Не `201` и не `204`: ресурса,
            который клиент мог бы открыть, нет, а сделает по жалобе
            что-то человек и позже (ADR-0017).
        "400":
          description: |
            Причина длиннее 1000 символов (`invalid_reason`) или тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост свой (`own_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет или смотрящему он не виден (`post_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/comments/{commentId}/report:
    post:
      operationId: reportComment
      summary: Пожаловаться на чужой комментарий
      description: |
        Жалоба подаётся по адресу поста, под которым лежит комментарий:
        пара должна сойтись, иначе `comment_not_found`
        (specs/008-reports.md). На свой комментарий не жалуются — свой
        удаляют.
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (UUID)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDraft"
      responses:
        "202":
          description: Жалоба принята; тела нет
        "400":
          description: |
            Причина длиннее 1000 символов (`invalid_reason`) или тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Комментарий свой (`own_comment`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Поста нет (`post_not_found`) или комментария нет либо он под
            другим постом (`comment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии, выданный `POST /auth/session`

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя (UUID)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Сколько записей вернуть, от 1 до 50
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор из предыдущего ответа; без него — первая страница
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
        message:
          type: string
          description: Человекочитаемое описание, пригодное для показа пользователю

    AuthCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: |
            Номер телефона в любом привычном виде: `+7 900 123-45-67`,
            `8 900 123 45 67`, `79001234567` — это один и тот же номер.
          example: "+7 900 123-45-67"

    AuthCodeTooSoon:
      description: |
        Та же ошибка, что и всюду, плюс остаток времени: приложение рисует
        по нему живой счётчик (specs/001-auth.md, требование 5).
      type: object
      required: [code, message, retry_after]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: too_many_requests
        message:
          type: string
          description: Человекочитаемое описание, пригодное для показа пользователю
        retry_after:
          type: integer
          format: int32
          minimum: 1
          description: Через сколько секунд можно запросить код снова
          example: 15

    AuthCodeAccepted:
      type: object
      required: [delivery, resend_after, code_ttl]
      properties:
        delivery:
          type: string
          enum: [sent, invite]
          description: |
            Как человек получит код. `sent` — сервис отправил код на номер.
            `invite` — сервис в режиме приглашений, код у человека уже есть
            в приглашении, и сроки ниже равны нулю (specs/015-invites.md).
          example: sent
        resend_after:
          type: integer
          format: int32
          description: Через сколько секунд можно запросить код снова
          example: 60
        code_ttl:
          type: integer
          format: int32
          description: Сколько секунд живёт выданный код
          example: 300

    SessionRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Тот же номер, на который запрашивали код
          example: "+7 900 123-45-67"
        code:
          type: string
          description: Код подтверждения, четыре цифры
          example: "1234"

    SessionCreated:
      type: object
      required: [token, is_new_user, user]
      properties:
        token:
          type: string
          description: |
            Токен сессии. Передаётся в заголовке `Authorization: Bearer <токен>`,
            не истекает по времени и действует, пока пользователь не вышел.
        is_new_user:
          type: boolean
          description: Этим входом пользователь зарегистрировался впервые
        user:
          $ref: "#/components/schemas/CurrentUser"

    SessionInfo:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"

    CurrentUser:
      type: object
      description: |
        Пользователь, каким его видит он сам. Номер телефона возвращается
        только владельцу сессии и не входит в публичное представление
        автора — см. CONTEXT.md.
      required: [id, phone, created_at, nickname, nickname_chosen, name, about, closed]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
          example: "0b3f4d3a-1d2e-4a5b-8c7d-9e0f1a2b3c4d"
        nickname:
          type: string
          description: |
            Уникальный никнейм: им пользователь подписан везде. Пока
            пользователь не выбрал его сам, он временный — `dachnik_…`.
          example: "Valya_dacha"
        nickname_chosen:
          type: boolean
          description: |
            Выбран ли никнейм самим пользователем. Пока `false`, приложение
            показывает экран знакомства.
          example: true
        phone:
          type: string
          description: Нормализованный номер телефона
          example: "+79001234567"
        created_at:
          type: string
          format: date-time
          description: Когда пользователь зарегистрировался
        name:
          type: string
          description: Полное имя, может быть пустым
          example: "Николай"
        about:
          type: string
          description: Короткое «о себе», может быть пустым
          example: "Три сотки под картошку"
        avatar_url:
          type: string
          nullable: true
          description: |
            Ссылка на аватар или `null`, если аватара нет. Может быть
            относительной — клиент достраивает её до адреса сервиса.
          example: "/media/avatars/6f1c8a2b4d5e6f70.jpg"
        closed:
          type: boolean
          description: |
            Закрыт ли профиль: посты и списки подписок видят только
            подписчики, новые подписываются по заявке (specs/012-follows.md)
          example: false
        place:
          $ref: "#/components/schemas/Place"

    Place:
      type: object
      description: |
        Населённый пункт из справочника ФИАС: город, село, деревня, СНТ
        (specs/025-places.md). В профиле поля нет, если пункт не выбран.
      required: [id, name, area]
      properties:
        id:
          type: string
          description: Идентификатор объекта в ФИАС
          example: "5f4a3b2c-1d0e-4f9a-8b7c-6d5e4f3a2b1c"
        name:
          type: string
          description: Название с типом, как его дал справочник
          example: "снт Андрейково"
        area:
          type: string
          description: |
            Что выше пункта, от ближнего к дальнему, через «, »; может быть
            пустым
          example: "Дмитровский р-н, Московская обл"

    PlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"

    PlaceUpdate:
      type: object
      properties:
        place_id:
          type: string
          nullable: true
          description: Идентификатор пункта из подсказок; `null` или пусто — убрать
          example: "5f4a3b2c-1d0e-4f9a-8b7c-6d5e4f3a2b1c"

    NicknameUpdate:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          description: |
            От 3 до 20 символов: латинские буквы, цифры и `_`. Пробелы
            по краям обрезаются.
          example: "Valya_dacha"

    ProfileUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Полное имя, до 50 символов, одна строка, может быть пустым
          example: "Николай"
        about:
          type: string
          description: Короткое «о себе», до 200 символов, одна строка
          example: "Три сотки под картошку"

    Post:
      type: object
      description: Пост — от одной до десяти фотографий и необязательная подпись.
      required: [id, created_at, caption, author, media, likes, liked, comments, visibility]
      properties:
        id:
          type: string
          description: Идентификатор поста (UUID)
          example: "2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        created_at:
          type: string
          format: date-time
          description: Когда пост опубликован
        caption:
          type: string
          description: Подпись, может быть пустой
          example: "Первая клубника в этом году"
        author:
          $ref: "#/components/schemas/Author"
        media:
          type: array
          minItems: 1
          maxItems: 10
          description: Медиа поста в порядке, в котором их прислал автор
          items:
            $ref: "#/components/schemas/Media"
        likes:
          type: integer
          format: int32
          description: Сколько людей отметили пост. Кто именно — не показывается.
          example: 3
        liked:
          type: boolean
          description: Отметил ли пост тот, кто спрашивает
          example: true
        comments:
          type: integer
          format: int32
          description: Сколько комментариев под постом
          example: 2
        visibility:
          $ref: "#/components/schemas/PostVisibility"
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Когда подпись последний раз меняли; нет или `null`, если не
            меняли (specs/022-edit-block-delete.md)
        place:
          $ref: "#/components/schemas/Place"
        distance_km:
          type: integer
          format: int32
          nullable: true
          description: |
            Примерное расстояние от пункта смотрящего до места поста, км,
            округлённое; `0` — тот же пункт. Нет или `null`, если его не
            посчитать или пост свой (specs/027-post-place.md, требования 7–9)
          example: 25
        # В required нет нарочно: сборка из PR ходит и на сервер с main,
        # где поля ещё нет. Сервер с тэгами отдаёт его всегда.
        tags:
          type: array
          maxItems: 10
          description: |
            Нормализованные тэги в порядке автора; нет тэгов — пустой
            массив (specs/028-post-tags.md)
          items:
            type: string
          example: ["груша", "сорт"]

    TagsUpdate:
      type: object
      # Поле нужно всегда, но в required его нет нарочно: тело без тэгов —
      # 400 invalid_request, как у CaptionUpdate.
      properties:
        tags:
          type: array
          description: |
            Новые тэги поста целиком; пустой массив снимает все. Обязательно:
            тело без него — `invalid_request`.
          items:
            type: string
          example: ["груша", "урожай"]

    TagSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          description: Подсказанные тэги, лучшие первыми
          items:
            type: string
          example: ["груша", "поделюсь", "советы"]

    CaptionUpdate:
      type: object
      # Поле нужно всегда, но в required его нет нарочно: пустая подпись
      # допустима, а тело без подписи — 400 invalid_request, и серверу
      # надо отличить «нет поля» от «пустая строка».
      properties:
        caption:
          type: string
          description: |
            Новая подпись, до 1000 символов после обрезки краёв; может быть
            пустой (specs/003-posts.md). Обязательна: тело без неё —
            `invalid_request`.
          example: "Первая клубника в этом году"

    PostVisibility:
      type: string
      enum: [all, friends, me]
      description: |
        Кто видит пост (specs/013-post-visibility.md): `all` — все, а у
        закрытого профиля — подписчики; `friends` — те, с кем автор
        подписан друг на друга; `me` — только автор.
      example: friends

    PostVisibilityUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/PostVisibility"

    Feed:
      type: object
      description: |
        Страница ленты. Конец ленты — это отсутствие `next_cursor`,
        а не пустой `items` (specs/004-feed.md).
      required: [items]
      properties:
        items:
          type: array
          description: Посты страницы, новые сверху
          items:
            $ref: "#/components/schemas/Post"
        next_cursor:
          type: string
          description: |
            Курсор на следующую страницу. Отсутствует, когда за этой
            страницей ничего нет.
          example: "MjAyNi0wOS0yMFQxMDowMDowMFp8N2Y0ZTFhOTA"

    Comments:
      type: object
      description: |
        Комментарии одного поста, от старого к новому. У поста без
        комментариев `items` пустой (specs/006-comments.md).
      required: [items]
      properties:
        items:
          type: array
          description: Комментарии поста, старые сверху
          items:
            $ref: "#/components/schemas/Comment"

    Comment:
      type: object
      description: |
        Текст, оставленный пользователем под постом. Комментарии плоские:
        ответов на комментарий не существует (CONTEXT.md).
      required: [id, created_at, text, author]
      properties:
        id:
          type: string
          description: Идентификатор комментария (UUID)
          example: "7f4e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        created_at:
          type: string
          format: date-time
          description: Когда комментарий оставлен
        text:
          type: string
          description: Текст комментария
          example: "И у нас такая же напасть, брызгали содой"
        author:
          $ref: "#/components/schemas/Author"
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Когда текст последний раз меняли; нет или `null`, если не
            меняли (specs/022-edit-block-delete.md)

    CommentDraft:
      type: object
      description: Из чего состоит комментарий — только текст.
      required: [text]
      properties:
        text:
          type: string
          description: |
            Текст комментария, до 1000 символов. Края обрезаются, пустой
            текст не принимается (specs/006-comments.md).
          example: "И у нас такая же напасть, брызгали содой"

    ReportDraft:
      type: object
      description: |
        Из чего состоит жалоба — только причина, и та необязательна:
        обязательная причина мешает пожаловаться на то, что и так
        очевидно (specs/008-reports.md, требование 2).
      properties:
        reason:
          type: string
          nullable: true
          description: |
            Что не так, свободным текстом, до 1000 символов. Края
            обрезаются; причина из одних пробелов — это отсутствие
            причины, а не ошибка.
          example: "Это не про дачу"

    Author:
      type: object
      description: |
        Публичное представление пользователя: то, чем он подписан рядом
        с постом, комментарием и лайком. Номер телефона в него не входит
        и входить не может — см. CONTEXT.md.
      required: [id, nickname, name]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
          example: "0b3f4d3a-1d2e-4a5b-8c7d-9e0f1a2b3c4d"
        nickname:
          type: string
          description: Никнейм — им автор подписан
          example: "Kolya_58"
        name:
          type: string
          description: Полное имя, может быть пустым
          example: "Николай"
        avatar_url:
          type: string
          nullable: true
          description: |
            Ссылка на аватар или `null`, если аватара нет. Может быть
            относительной — клиент достраивает её до адреса сервиса.
          example: "/media/avatars/6f1c8a2b4d5e6f70.jpg"

    UserProfile:
      type: object
      description: |
        Пользователь, каким его видят соседи: публичное представление автора
        и то, что о себе рассказал он сам. Номера телефона нет — см. CONTEXT.md.
      required: [id, nickname, name, about, created_at, posts, followers, following, closed, blocked]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
          example: "0b3f4d3a-1d2e-4a5b-8c7d-9e0f1a2b3c4d"
        nickname:
          type: string
          description: Никнейм — крупно на странице пользователя
          example: "Valya_dacha"
        name:
          type: string
          description: Полное имя, может быть пустым; на странице — под никнеймом
          example: "Валентина"
        about:
          type: string
          description: Короткое «о себе», может быть пустым
          example: "Теплица, три грядки клубники и кот Василий"
        avatar_url:
          type: string
          nullable: true
          description: |
            Ссылка на аватар или `null`, если аватара нет. Может быть
            относительной — клиент достраивает её до адреса сервиса.
          example: "/media/avatars/6f1c8a2b4d5e6f70.jpg"
        created_at:
          type: string
          format: date-time
          description: Когда пользователь зарегистрировался
        posts:
          type: integer
          format: int32
          description: Сколько у пользователя постов сейчас
          example: 14
        followers:
          type: integer
          format: int32
          description: Сколько у пользователя подписчиков; заявки не в счёт
          example: 12
        following:
          type: integer
          format: int32
          description: На сколько человек подписан пользователь; заявки не в счёт
          example: 7
        closed:
          type: boolean
          description: Закрыт ли профиль (specs/012-follows.md)
          example: false
        blocked:
          type: boolean
          description: |
            Заблокировал ли смотрящий этого человека; в своём профиле
            `false` (specs/022-edit-block-delete.md)
          example: false
        place:
          $ref: "#/components/schemas/Place"
        relation:
          $ref: "#/components/schemas/Relation"

    Relation:
      type: object
      description: |
        Отношение смотрящего к пользователю: по нему строится кнопка
        «Подписаться» / «Вы подписаны» / «Заявка отправлена»
        (specs/012-follows.md).
      required: [following, followed_by]
      properties:
        following:
          type: string
          enum: [none, requested, "yes"]
          description: |
            Смотрящий → пользователь: `none` — не подписан, `requested` —
            заявка ждёт ответа, `yes` — подписан.
          example: "yes"
        followed_by:
          type: boolean
          description: Подписан ли пользователь на смотрящего (заявка не в счёт)
          example: false

    FollowUser:
      type: object
      description: |
        Человек в списке подписчиков или подписок: публичное представление
        автора и отношение к нему смотрящего. У самого смотрящего
        `relation` нет — кнопки в его строке не бывает.
      required: [id, nickname, name]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
        nickname:
          type: string
          description: Никнейм
          example: "Valya_dacha"
        name:
          type: string
          description: Полное имя, может быть пустым
          example: "Валентина"
        avatar_url:
          type: string
          nullable: true
          description: Ссылка на аватар или `null`
        relation:
          $ref: "#/components/schemas/Relation"

    FollowList:
      type: object
      description: Страница подписчиков или подписок. Конец — отсутствие `next_cursor`.
      required: [items]
      properties:
        items:
          type: array
          description: Люди страницы, новые связи сверху
          items:
            $ref: "#/components/schemas/FollowUser"
        next_cursor:
          type: string
          description: Курсор на следующую страницу; нет, когда дальше ничего нет

    AuthorList:
      type: object
      description: Страница людей — заявки на подписку. Конец — отсутствие `next_cursor`.
      required: [items]
      properties:
        items:
          type: array
          description: Заявители, новые заявки сверху
          items:
            $ref: "#/components/schemas/Author"
        next_cursor:
          type: string
          description: Курсор на следующую страницу; нет, когда дальше ничего нет

    Notification:
      type: object
      description: |
        Строка раздела «Уведомления» (specs/014-notifications.md,
        требование 1). У `like` это все лайки одного поста: `actor` —
        последний отметивший, `created_at` — время его лайка, `others` —
        сколько отметили кроме него.
      required: [id, kind, created_at, actor, unread]
      properties:
        id:
          type: string
          description: Идентификатор строки (UUID)
        kind:
          type: string
          enum: [follow, follow_accepted, like, comment]
          description: |
            `follow` — подписался на вас, `follow_accepted` — принял вашу
            заявку, `like` — отметил ваш пост, `comment` — ответил на ваш пост.
        created_at:
          type: string
          format: date-time
          description: Когда это случилось
        actor:
          $ref: "#/components/schemas/FollowUser"
        others:
          type: integer
          format: int32
          description: Только у `like` — сколько ещё людей отметили пост
          example: 2
        post:
          $ref: "#/components/schemas/NotificationPost"
        comment:
          type: string
          description: Только у `comment` — начало комментария, до 100 символов
          example: "Какие огурцы! Сорт какой?"
        unread:
          type: boolean
          description: Новее ли строка последнего открытия раздела

    Feedback:
      type: object
      description: Отзыв разработчику (specs/019-feedback.md)
      required: [id, text, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        status:
          type: string
          enum: [sent, accepted, approved, declined, done, released]
          description: |
            `sent` — записан, задачи ещё нет; `accepted` — задача заведена;
            `approved` — одобрено; `declined` — делать не будем; `done` —
            сделано, ждёт сборки; `released` — вышло в сборке `build`.
        issue:
          type: integer
          format: int32
          description: Номер задачи GitHub, когда она заведена
          example: 71
        build:
          type: integer
          format: int64
          description: Только у `released` — номер сборки, в которой вышло
          example: 386950
        created_at:
          type: string
          format: date-time

    FeedbackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Отзывы, новые сверху
          items:
            $ref: "#/components/schemas/Feedback"

    AppSessionStarted:
      type: object
      description: Начатая сессия в приложении (specs/020-app-sessions.md)
      required: [id]
      properties:
        id:
          type: string

    AppSessionEnd:
      type: object
      description: Конец сессии и экраны, открытые за неё
      properties:
        screens:
          type: object
          description: |
            Сколько раз открывался каждый экран за всю сессию — счётчик
            накопительный (specs/020-app-sessions.md, требования 8–10)
          additionalProperties:
            type: integer
            format: int32
          example: {"feed": 3, "post": 5}

    AppErrorReport:
      type: object
      description: Отчёт о необработанной ошибке (specs/021-app-errors.md, требование 1)
      required: [error]
      properties:
        error:
          type: string
          description: Текст ошибки, от 1 до 2000 символов
          example: Null check operator used on a null value
        stack:
          type: string
          description: Стек, до 20000 символов
        version:
          type: string
          description: Версия приложения, до 32 символов
          example: 1.0.0
        build:
          type: integer
          format: int64
          description: Номер сборки, от 0
          example: 386900
        screen:
          type: string
          description: |
            Последний открытый экран, 1–32 символа `a-z` и `_`
            (specs/020-app-sessions.md, требование 10)
          example: post
        os:
          type: string
          description: Система телефона, до 100 символов
          example: android 14

    NotificationPost:
      type: object
      description: Пост в строке уведомления — у `like` и `comment`
      required: [id, thumbnail]
      properties:
        id:
          type: string
          description: Идентификатор поста (UUID)
        thumbnail:
          $ref: "#/components/schemas/Media"

    NotificationList:
      type: object
      description: Страница уведомлений. Конец — отсутствие `next_cursor`.
      required: [items]
      properties:
        items:
          type: array
          description: Строки страницы, новые сверху
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          description: Курсор на следующую страницу; нет, когда дальше ничего нет

    UnreadNotifications:
      type: object
      required: [unread, requests]
      properties:
        unread:
          type: integer
          format: int32
          description: Сколько строк раздела новее последнего открытия
          example: 4
        requests:
          type: integer
          format: int32
          description: Сколько заявок на подписку ждут ответа
          example: 1

    PushToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            Токен Firebase Cloud Messaging. Пробелы по краям не считаются;
            после них — от 1 до 4096 символов.
          example: "dQw4w9WgXcQ:APA91bH…"

    PrivacyUpdate:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
          nullable: true
          description: |
            `true` — профиль закрыт, `false` — открыт. `null` — не ответ,
            а ошибка `invalid_request`.
          example: true

    PostDraft:
      type: object
      description: Из чего собирается пост.
      required: [media_ids]
      properties:
        media_ids:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Идентификаторы уже загруженных фотографий, в том порядке,
            в котором они должны стоять в посте.
          items:
            type: string
          example: ["2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"]
        caption:
          type: string
          description: Подпись, до 1000 символов, может быть пустой
          example: "Первая клубника в этом году"
        visibility:
          $ref: "#/components/schemas/PostVisibility"
        place_id:
          type: string
          nullable: true
          description: |
            Место поста — пункт из подсказок `GET /places`; нет, `null` или
            пустая строка — без места (specs/027-post-place.md)
          example: "5f4a3b2c-1d0e-4f9a-8b7c-6d5e4f3a2b1c"
        tags:
          type: array
          nullable: true
          description: |
            Тэги поста, до десяти; сервер нормализует их: без `#` в начале,
            в нижнем регистре, без повторов (specs/028-post-tags.md)
          items:
            type: string
          example: ["Груша", "#сорт"]

    Media:
      type: object
      description: |
        Одно медиа: загруженное или уже опубликованное в посте. Видео
        заложено в модель, но в MVP сервер принимает только фотографии
        (docs/adr/0006-post-is-media.md).
      required: [id, kind, url, width, height]
      properties:
        id:
          type: string
          description: Идентификатор медиа (UUID)
          example: "2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        kind:
          type: string
          enum: [photo]
          description: Вид медиа. В MVP всегда `photo`.
        url:
          type: string
          description: |
            Ссылка на файл. Может быть относительной — клиент достраивает
            её до адреса сервиса.
          example: "/media/posts/2b7e1a905c3d4f21.jpg"
        width:
          type: integer
          format: int32
          description: Ширина в пикселях — чтобы занять место до загрузки
          example: 1600
        height:
          type: integer
          format: int32
          description: Высота в пикселях
          example: 1200
