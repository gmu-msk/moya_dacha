openapi: 3.0.3

info:
  title: МояДача API
  version: 0.1.0
  description: |
    Источник истины для контракта между сервером и клиентами.
    Из этого файла генерируются серверные типы и роутинг (Go) и клиент (Dart).
    Руками сгенерированные файлы не правятся — см. docs/adr/0001-spec-first-openapi.md.

    Продуктовые эндпоинты добавляются вместе со спецификациями фич
    в specs/00X-*.md. Сейчас описаны: вход по номеру телефона
    (specs/001-auth.md), профиль пользователя (specs/002-profile.md),
    загрузка фотографий и создание поста (specs/003-posts.md)
    и операционная проверка живости.

servers:
  - url: /api
    description: Базовый путь

paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и доступности базы
      description: |
        Операционный эндпоинт, не часть продуктового API. Используется
        деплоем и мониторингом.
      tags: [operations]
      responses:
        "200":
          description: Сервис жив, база отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервис жив, но база недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/code:
    post:
      operationId: requestAuthCode
      summary: Запросить код подтверждения на номер телефона
      description: |
        Ответ одинаков для нового и для уже зарегистрированного номера:
        по нему нельзя узнать, есть ли такой пользователь.

        Доставка кода спрятана за интерфейсом: пока SMS-провайдер не выбран,
        код пишется в лог сервиса (specs/001-auth.md).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeRequest"
      responses:
        "202":
          description: Код выдан и отправлен на номер
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeAccepted"
        "400":
          description: Номер не разбирается или не российский мобильный
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Код на этот номер запрашивали меньше минуты назад
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeTooSoon"

  /auth/session:
    post:
      operationId: createSession
      summary: Войти по коду подтверждения
      description: |
        Регистрация и вход — одно действие: если номера ещё нет,
        пользователь создаётся, и вход помечается как первый.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Код подошёл, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: Номер или код не разбираются
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Код не тот (`invalid_code`), истёк (`code_expired`)
            или исчерпаны попытки (`too_many_attempts`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: getSession
      summary: Чья это сессия
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteSession
      summary: Выйти
      description: |
        Прекращает действие только этого токена. Сессии на других
        устройствах продолжают работать.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Сессия прекращена
        "401":
          description: Токена нет или он уже недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      operationId: getMe
      summary: Мой профиль
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль владельца токена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      operationId: updateMe
      summary: Изменить имя и «о себе»
      description: |
        Замена обоих полей сразу, а не частичное изменение: пустое
        `about` очищает поле.
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Профиль изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: |
            Имя пустое или слишком длинное (`invalid_name`),
            «о себе» слишком длинное (`invalid_about`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/avatar:
    put:
      operationId: setAvatar
      summary: Поставить аватар
      description: |
        Картинка JPEG или PNG не больше 5 МБ. Сервис уменьшает её до
        512×512 и пересохраняет в JPEG; новый аватар заменяет прежний.
      tags: [profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Картинка JPEG или PNG
      responses:
        "200":
          description: Аватар поставлен, профиль с новой ссылкой
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Файл не картинка или в запросе нет поля `file`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Картинка больше 5 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteAvatar
      summary: Убрать аватар
      description: Убрать аватар, которого нет, — не ошибка.
      tags: [profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Аватара нет, профиль без ссылки на него
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /media:
    post:
      operationId: uploadMedia
      summary: Загрузить фотографию
      description: |
        Фотография JPEG или PNG не больше 10 МБ. Сервис уменьшает её до
        1600 по большей стороне и пересохраняет в JPEG.

        Загруженная фотография ещё не опубликована: она ждёт, пока автор
        соберёт из неё пост (specs/003-posts.md). Каждая фотография идёт
        своим запросом — на плохой связи переотправить нужно только ту,
        что не долетела.
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Фотография JPEG или PNG
      responses:
        "201":
          description: Фотография загружена и ждёт публикации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: Файл не картинка или в запросе нет поля `file`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Фотография больше 10 МБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts:
    post:
      operationId: createPost
      summary: Опубликовать пост
      description: |
        От одной до четырёх уже загруженных фотографий и необязательная
        подпись. Поста без медиа не существует
        (docs/adr/0006-post-is-media.md).

        Порядок фотографий в посте — порядок идентификаторов в `media_ids`.
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDraft"
      responses:
        "201":
          description: Пост опубликован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: |
            Нет ни одной фотографии (`no_media`), фотографий больше четырёх
            (`too_many_media`), фотография чужая, уже опубликована или не
            существует (`invalid_media`), подпись слишком длинная
            (`invalid_caption`), тело запроса не разбирается
            (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}:
    get:
      operationId: getPost
      summary: Показать пост
      description: |
        Лента одна на всех, поэтому пост открывается любому вошедшему
        пользователю, а не только автору (CONTEXT.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deletePost
      summary: Удалить свой пост
      description: |
        Удаление жёсткое: вместе с постом уходят его фотографии, лайки и
        комментарии, в том числе чужие
        (docs/adr/0007-hard-delete.md). Удалить можно только своё; чужое
        убирает владелец сервиса по жалобе (specs/007-deletion.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "204":
          description: Пост удалён; тела нет
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост есть, но он чужой (`not_your_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /feed:
    get:
      operationId: getFeed
      summary: Страница ленты
      description: |
        Все посты всех пользователей, новые сверху: лента одна на всех
        (CONTEXT.md). Отдаётся страницами — посты и курсор на продолжение.

        Курсор непрозрачен: клиент возвращает его как получил и сам
        не строит. Он указывает на место в порядке ленты, поэтому посты,
        выложенные между запросами страниц, не сдвигают и не задваивают
        уже пролистанное (specs/004-feed.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Сколько постов вернуть, от 1 до 50
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Курсор из предыдущего ответа; без него — первая страница
          schema:
            type: string
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: |
            `limit` вне диапазона или не число (`invalid_request`), курсор
            не разбирается (`invalid_cursor`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/like:
    put:
      operationId: likePost
      summary: Поставить лайк
      description: |
        Один пользователь — не больше одного лайка на пост (CONTEXT.md).
        Запрос идемпотентен: повторный лайк ничего не меняет и не ошибка.

        В ответе — пост целиком, с новым числом лайков: клиенту не нужно
        досчитывать его самому (specs/005-likes.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост с поставленным лайком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unlikePost
      summary: Снять лайк
      description: |
        Идемпотентно: снять лайк, которого не было, — не ошибка
        (specs/005-likes.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Пост со снятым лайком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/comments:
    get:
      operationId: getComments
      summary: Комментарии поста
      description: |
        Комментарии поста от старого к новому: это разговор, и читается
        он сверху вниз. Приходят целиком, без страниц — под постом их
        столько, что курсор не нужен (specs/006-comments.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      responses:
        "200":
          description: Комментарии поста
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comments"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addComment
      summary: Оставить комментарий
      description: |
        Комментарии плоские: ответов на комментарий не существует
        (CONTEXT.md). В ответе — созданный комментарий, а не пост:
        весь разговор на каждую реплику не отдаётся
        (specs/006-comments.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentDraft"
      responses:
        "201":
          description: Комментарий оставлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: |
            Текста нет или он из одних пробелов (`empty_comment`), текст
            длиннее 1000 символов (`invalid_comment`), тело запроса не
            разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{postId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Удалить свой комментарий
      description: |
        Комментарий удаляется по адресу своего поста: сначала должен
        найтись пост, потом комментарий под ним, и только потом
        проверяется, чей он. Чужой комментарий не удаляется даже автором
        поста (specs/007-deletion.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (UUID)
          schema:
            type: string
      responses:
        "204":
          description: Комментарий удалён; тела нет
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Комментарий есть, но он чужой (`not_your_comment`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Поста нет (`post_not_found`) или комментария нет либо он под
            другим постом (`comment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/report:
    post:
      operationId: reportPost
      summary: Пожаловаться на чужой пост
      description: |
        Жалоба — сигнал владельцу сервиса, который разбирает её вручную.
        Она ничего не скрывает и ничего не меняет: пост остаётся на
        месте, автор о жалобе не узнаёт (CONTEXT.md, ADR-0017).

        На свой пост не жалуются — свой удаляют (specs/007-deletion.md).
        Повторная жалоба того же человека принимается так же, как
        первая, и ничего не меняет (specs/008-reports.md).
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDraft"
      responses:
        "202":
          description: |
            Жалоба принята; тела нет. Не `201` и не `204`: ресурса,
            который клиент мог бы открыть, нет, а сделает по жалобе
            что-то человек и позже (ADR-0017).
        "400":
          description: |
            Причина длиннее 1000 символов (`invalid_reason`) или тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Пост свой (`own_post`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Поста с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}/comments/{commentId}/report:
    post:
      operationId: reportComment
      summary: Пожаловаться на чужой комментарий
      description: |
        Жалоба подаётся по адресу поста, под которым лежит комментарий:
        пара должна сойтись, иначе `comment_not_found`
        (specs/008-reports.md). На свой комментарий не жалуются — свой
        удаляют.
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Идентификатор поста (UUID)
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (UUID)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDraft"
      responses:
        "202":
          description: Жалоба принята; тела нет
        "400":
          description: |
            Причина длиннее 1000 символов (`invalid_reason`) или тело
            запроса не разбирается (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Токена нет или он недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Комментарий свой (`own_comment`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Поста нет (`post_not_found`) или комментария нет либо он под
            другим постом (`comment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии, выданный `POST /auth/session`

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
        message:
          type: string
          description: Человекочитаемое описание, пригодное для показа пользователю

    AuthCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: |
            Номер телефона в любом привычном виде: `+7 900 123-45-67`,
            `8 900 123 45 67`, `79001234567` — это один и тот же номер.
          example: "+7 900 123-45-67"

    AuthCodeTooSoon:
      description: |
        Та же ошибка, что и всюду, плюс остаток времени: приложение рисует
        по нему живой счётчик (specs/001-auth.md, требование 5).
      type: object
      required: [code, message, retry_after]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: too_many_requests
        message:
          type: string
          description: Человекочитаемое описание, пригодное для показа пользователю
        retry_after:
          type: integer
          format: int32
          minimum: 1
          description: Через сколько секунд можно запросить код снова
          example: 15

    AuthCodeAccepted:
      type: object
      required: [resend_after, code_ttl]
      properties:
        resend_after:
          type: integer
          format: int32
          description: Через сколько секунд можно запросить код снова
          example: 60
        code_ttl:
          type: integer
          format: int32
          description: Сколько секунд живёт выданный код
          example: 300

    SessionRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Тот же номер, на который запрашивали код
          example: "+7 900 123-45-67"
        code:
          type: string
          description: Код подтверждения, четыре цифры
          example: "1234"

    SessionCreated:
      type: object
      required: [token, is_new_user, user]
      properties:
        token:
          type: string
          description: |
            Токен сессии. Передаётся в заголовке `Authorization: Bearer <токен>`,
            не истекает по времени и действует, пока пользователь не вышел.
        is_new_user:
          type: boolean
          description: Этим входом пользователь зарегистрировался впервые
        user:
          $ref: "#/components/schemas/CurrentUser"

    SessionInfo:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"

    CurrentUser:
      type: object
      description: |
        Пользователь, каким его видит он сам. Номер телефона возвращается
        только владельцу сессии и не входит в публичное представление
        автора — см. CONTEXT.md.
      required: [id, phone, created_at, name, about]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
          example: "0b3f4d3a-1d2e-4a5b-8c7d-9e0f1a2b3c4d"
        phone:
          type: string
          description: Нормализованный номер телефона
          example: "+79001234567"
        created_at:
          type: string
          format: date-time
          description: Когда пользователь зарегистрировался
        name:
          type: string
          description: |
            Отображаемое имя. Пустая строка означает, что пользователь ещё
            не знакомился: приложение показывает ему экран знакомства.
          example: "Николай"
        about:
          type: string
          description: Короткое «о себе», может быть пустым
          example: "Три сотки под картошку"
        avatar_url:
          type: string
          nullable: true
          description: |
            Ссылка на аватар или `null`, если аватара нет. Может быть
            относительной — клиент достраивает её до адреса сервиса.
          example: "/media/avatars/6f1c8a2b4d5e6f70.jpg"

    ProfileUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Отображаемое имя, от 1 до 50 символов, одна строка
          example: "Николай"
        about:
          type: string
          description: Короткое «о себе», до 200 символов, одна строка
          example: "Три сотки под картошку"

    Post:
      type: object
      description: Пост — от одной до четырёх фотографий и необязательная подпись.
      required: [id, created_at, caption, author, media, likes, liked, comments]
      properties:
        id:
          type: string
          description: Идентификатор поста (UUID)
          example: "2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        created_at:
          type: string
          format: date-time
          description: Когда пост опубликован
        caption:
          type: string
          description: Подпись, может быть пустой
          example: "Первая клубника в этом году"
        author:
          $ref: "#/components/schemas/Author"
        media:
          type: array
          minItems: 1
          maxItems: 4
          description: Медиа поста в порядке, в котором их прислал автор
          items:
            $ref: "#/components/schemas/Media"
        likes:
          type: integer
          format: int32
          description: Сколько людей отметили пост. Кто именно — не показывается.
          example: 3
        liked:
          type: boolean
          description: Отметил ли пост тот, кто спрашивает
          example: true
        comments:
          type: integer
          format: int32
          description: Сколько комментариев под постом
          example: 2

    Feed:
      type: object
      description: |
        Страница ленты. Конец ленты — это отсутствие `next_cursor`,
        а не пустой `items` (specs/004-feed.md).
      required: [items]
      properties:
        items:
          type: array
          description: Посты страницы, новые сверху
          items:
            $ref: "#/components/schemas/Post"
        next_cursor:
          type: string
          description: |
            Курсор на следующую страницу. Отсутствует, когда за этой
            страницей ничего нет.
          example: "MjAyNi0wOS0yMFQxMDowMDowMFp8N2Y0ZTFhOTA"

    Comments:
      type: object
      description: |
        Комментарии одного поста, от старого к новому. У поста без
        комментариев `items` пустой (specs/006-comments.md).
      required: [items]
      properties:
        items:
          type: array
          description: Комментарии поста, старые сверху
          items:
            $ref: "#/components/schemas/Comment"

    Comment:
      type: object
      description: |
        Текст, оставленный пользователем под постом. Комментарии плоские:
        ответов на комментарий не существует (CONTEXT.md).
      required: [id, created_at, text, author]
      properties:
        id:
          type: string
          description: Идентификатор комментария (UUID)
          example: "7f4e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        created_at:
          type: string
          format: date-time
          description: Когда комментарий оставлен
        text:
          type: string
          description: Текст комментария
          example: "И у нас такая же напасть, брызгали содой"
        author:
          $ref: "#/components/schemas/Author"

    CommentDraft:
      type: object
      description: Из чего состоит комментарий — только текст.
      required: [text]
      properties:
        text:
          type: string
          description: |
            Текст комментария, до 1000 символов. Края обрезаются, пустой
            текст не принимается (specs/006-comments.md).
          example: "И у нас такая же напасть, брызгали содой"

    ReportDraft:
      type: object
      description: |
        Из чего состоит жалоба — только причина, и та необязательна:
        обязательная причина мешает пожаловаться на то, что и так
        очевидно (specs/008-reports.md, требование 2).
      properties:
        reason:
          type: string
          nullable: true
          description: |
            Что не так, свободным текстом, до 1000 символов. Края
            обрезаются; причина из одних пробелов — это отсутствие
            причины, а не ошибка.
          example: "Это не про дачу"

    Author:
      type: object
      description: |
        Публичное представление пользователя: то, чем он подписан рядом
        с постом, комментарием и лайком. Номер телефона в него не входит
        и входить не может — см. CONTEXT.md.
      required: [id, name]
      properties:
        id:
          type: string
          description: Идентификатор пользователя (UUID)
          example: "0b3f4d3a-1d2e-4a5b-8c7d-9e0f1a2b3c4d"
        name:
          type: string
          description: Отображаемое имя
          example: "Николай"
        avatar_url:
          type: string
          nullable: true
          description: |
            Ссылка на аватар или `null`, если аватара нет. Может быть
            относительной — клиент достраивает её до адреса сервиса.
          example: "/media/avatars/6f1c8a2b4d5e6f70.jpg"

    PostDraft:
      type: object
      description: Из чего собирается пост.
      required: [media_ids]
      properties:
        media_ids:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            Идентификаторы уже загруженных фотографий, в том порядке,
            в котором они должны стоять в посте.
          items:
            type: string
          example: ["2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"]
        caption:
          type: string
          description: Подпись, до 1000 символов, может быть пустой
          example: "Первая клубника в этом году"

    Media:
      type: object
      description: |
        Одно медиа: загруженное или уже опубликованное в посте. Видео
        заложено в модель, но в MVP сервер принимает только фотографии
        (docs/adr/0006-post-is-media.md).
      required: [id, kind, url, width, height]
      properties:
        id:
          type: string
          description: Идентификатор медиа (UUID)
          example: "2b7e1a90-5c3d-4f21-9a8b-6c5d4e3f2a10"
        kind:
          type: string
          enum: [photo]
          description: Вид медиа. В MVP всегда `photo`.
        url:
          type: string
          description: |
            Ссылка на файл. Может быть относительной — клиент достраивает
            её до адреса сервиса.
          example: "/media/posts/2b7e1a905c3d4f21.jpg"
        width:
          type: integer
          format: int32
          description: Ширина в пикселях — чтобы занять место до загрузки
          example: 1600
        height:
          type: integer
          format: int32
          description: Высота в пикселях
          example: 1200
